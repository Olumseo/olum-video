# ─────────────────────────────────────────────────────────────────────────────
#  nginx INSIDE the olum.video frontend container.
#
#  Serves static files only. API calls never reach here — the browser sends
#  them to olum.ai/api, which olum.ai's own nginx proxies to the gateway.
#
#  Each app is a single-page app: the server has exactly one real HTML file per
#  app, and the router draws every "page" in the browser. So a request for
#  /video/settings must return /video/index.html — there is no settings.html on
#  disk. That is what the try_files fallbacks below do.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx picks the LONGEST matching prefix, not the first one in the file,
    # so /video/welcome/ wins over /video/. The order below is for humans.

    # ── Landing page · /video/welcome ────────────────────────────────────────
    location = /video/welcome {
        # Serve the file directly rather than redirecting to a trailing slash.
        # A 301 would put an extra round trip in front of every visit.
        try_files /video/welcome/index.html =404;
    }
    location /video/welcome/assets/ {
        # Safe to cache for a year because the filename contains a hash of the
        # contents: any change produces a NEW filename, so a stale file can
        # never be served.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /video/welcome/index.html {
        # The exact opposite rule. index.html names the current hashed files,
        # so a cached copy would point browsers at chunks a newer deploy has
        # already deleted.
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /video/welcome/media/ {
        # The showcase videos and their posters.
        #
        # They need their own block for two reasons. Their filenames are NOT
        # hashed — they come from public/, which Vite copies verbatim — so the
        # year-long immutable rule below would pin a replaced video in every
        # visitor's cache indefinitely. A day is long enough to matter for
        # repeat visits and short enough that swapping a clip actually lands.
        #
        # And `=404` instead of the SPA fallback: without it a mistyped video
        # URL returns index.html with a 200, so the <video> element receives
        # HTML, fails to decode it, and shows a broken tile rather than a clear
        # missing-file error in the network log.
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location /video/welcome/ {
        try_files $uri $uri/ /video/welcome/index.html;
    }

    # ── Client application · /video ──────────────────────────────────────────
    location = /video {
        try_files /video/index.html =404;
    }
    location /video/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /video/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /video/ {
        try_files $uri $uri/ /video/index.html;
    }

    # ── Staff portal · /staff ────────────────────────────────────────────────
    location = /staff {
        try_files /staff/index.html =404;
    }
    location /staff/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /staff/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /staff/ {
        try_files $uri $uri/ /staff/index.html;
    }

    # Container health check. Not reachable from the internet — olum.ai's nginx
    # only proxies the three prefixes above.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Anything else is a routing mistake, not a page. Returning 404 here rather
    # than falling back to an app makes a misconfigured proxy obvious instead
    # of silently rendering the wrong application.
    location / {
        return 404;
    }
}
